version: '3.8'

services:
  summarizer-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: t5-dialogue-summarizer
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

